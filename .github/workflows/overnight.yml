name: Soccer Hub overnight (prune + rebuild + recaps)
# Dispatch-only: sl-scheduler starts it at 3:15 AM ET (main) and 5:15 AM ET (backup); no GitHub cron.
# hub_profiles.json is rebuilt by bet-lab-engine soccer-profiles.yml (needs private engine box data), dispatched at 3:05 AM ET.
on:
  workflow_dispatch:
    inputs:
      day: { description: "Recap day (YYYY-MM-DD, ET). Blank = yesterday ET", required: false, default: "" }
concurrency: { group: soccer-hub-overnight, cancel-in-progress: false }
permissions: {}
jobs:
  overnight:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recaps for the finished day (before pruning)
        run: python scripts/recaps.py ${{ inputs.day }}
      - name: Rebuild every league and cup file (even with no new fixtures) + prune past games
        run: python scripts/fetch.py soccer && python scripts/prune_past.py
      - run: python scripts/scorers.py || echo 'scorers failed, keeping last file'
        env:
          SL_BACKUP_KEY: ${{ secrets.SL_BACKUP_KEY }}
      - name: High Hurdles (real match logs; display only)
        run: python scripts/high_hurdles.py || echo 'high hurdles failed, keeping last file'
      - run: |
          git config user.name "sports-labs-bot"; git config user.email "actions@users.noreply.github.com"
          python3 scripts/srcscrub.py data; git add data; git diff --cached --quiet || (git commit -m "Soccer Hub overnight $(date -u +%FT%TZ)" && { ok=0; for i in 1 2 3 4 5; do if git pull --rebase -X theirs -q && git push -q; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep $((i*7)); done; [ "$ok" -eq 1 ] || { echo "::error::push failed after 5 tries"; exit 1; }; })
