name: Soccer Hub data
on:
  schedule:
    - cron: "10 10 * * *"        # 6:10 AM ET daily: fixtures, tables, news
    - cron: "40 15 * * *"        # 11:40 AM ET daily backup
    - cron: "*/30 11-23 * * 0,1,4,5,6" # match windows (Europe Fri/Sat/Sun/Mon + MLS + Saudi Thu)
    - cron: "*/30 0-3 * * 0,1,4" # MLS late finishes (UTC next day)
    - cron: "*/30 16-21 * * 2,3" # Champions League Tue/Wed
  workflow_dispatch:
concurrency: { group: soccer-hub-data, cancel-in-progress: false }
permissions: {}   # least privilege by default; write scope granted per job below
jobs:
  pull:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch.py soccer
      - run: python scripts/scorers.py || echo 'scorers failed, keeping last file'
        env:
          SL_BACKUP_KEY: ${{ secrets.SL_BACKUP_KEY }}
      - run: |
          git config user.name "sports-labs-bot"; git config user.email "actions@users.noreply.github.com"
          python3 scripts/srcscrub.py data; git add data; git diff --cached --quiet || (git commit -m "Soccer Hub data $(date -u +%FT%TZ)" && git pull --rebase && git push)
